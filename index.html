<!doctype html>

    <link
        rel="icon"
        href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text x='50' y='68' text-anchor='middle' font-size='70' font-family='monospace' font-weight='bold'>&amp;lt;/&amp;gt;</text></svg>">
    <title>Efthymios Koktsidis</title>
    <meta
        name="description"
        content="Principal Software Engineer focused on .NET, ASP.NET Core and Azure. Open-source libraries and tools.">
    <link rel="canonical" href="https://efthymios-ks.github.io/Portfolio/">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://efthymios-ks.github.io/Portfolio/">
    <meta property="og:title" content="Efthymios Koktsidis">
    <meta
        property="og:description"
        content="Principal Software Engineer focused on .NET, ASP.NET Core and Azure. Open-source libraries and tools.">
    <meta property="og:image" content="https://github.com/efthymios-ks.png">
    <meta name="twitter:card" content="summary">
    <script>
        // @ts-check
        // Classic, not a module: it must run before first paint to avoid a light flash in dark mode.
        {
            const THEMES = ['light', 'dark'];
            const readStoredTheme = () => {
                try {
                    return localStorage.getItem('theme');
                } catch {
                    return null;
                }
            };
            const storedTheme = readStoredTheme() ?? '';
            const prefersDark = matchMedia('(prefers-color-scheme: dark)').matches;
            const fallbackTheme = prefersDark ? 'dark' : 'light';

            document.documentElement.dataset.theme = THEMES.includes(storedTheme) ? storedTheme : fallbackTheme;
        }
    </script>
    <style>
        :root[data-theme="dark"] {
            color-scheme: dark;

            --bg: #181818;
            --surface: #1f1f1f;
            --surface-raised: #2a2d2e;

            --text: #d4d4d4;
            --muted: #9d9d9d;

            --border: #2b2b2b;
            --border-strong: #454545;

            --accent: #4ec9b0;
            --accent-soft: #163f3a;
            --accent-text: #1f1f1f;
            --selection-bg: #264f78;

            --radius: 8px;
            --radius-small: 4px;
            --shadow: rgb(0 0 0 / 36%);
            --shadow-strong: rgb(0 0 0 / 60%);
        }

        :root[data-theme="light"] {
            color-scheme: light;

            --bg: #f8f8f8;
            --surface: #ffffff;
            --surface-raised: #f2f2f2;

            --text: #3b3b3b;
            --muted: #616161;

            --border: #e5e5e5;
            --border-strong: #cecece;

            --accent: #005fb8;
            --accent-soft: #e0edf9;
            --accent-text: #ffffff;
            --selection-bg: #add6ff;

            --radius: 8px;
            --radius-small: 4px;
            --shadow: rgb(0 0 0 / 8%);
            --shadow-strong: rgb(0 0 0 / 16%);
        }

        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        ::selection {
            background: var(--selection-bg);
        }

        :focus-visible {
            outline: 2px solid var(--accent);
            outline-offset: 2px;
        }

        html {
            touch-action: pan-x pan-y;
        }

        body {
            min-height: 100vh;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            line-height: 1.6;
            color: var(--text);
            background: var(--bg);
            transition: background-color 0.15s ease, color 0.15s ease;
        }

        .skip-link {
            position: absolute;
            top: -40px;
            left: 8px;
            z-index: 20;
            padding: 6px 12px;
            font-size: 0.82rem;
            color: var(--accent-text);
            background: var(--accent);
            border-radius: var(--radius-small);
        }

        .skip-link:focus-visible {
            top: 8px;
        }

        .site-header {
            position: sticky;
            top: 0;
            z-index: 10;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 20px;
            background: var(--surface);
            border-bottom: 1px solid var(--border);
        }

        .site-title {
            font-size: 0.9rem;
            font-weight: 600;
            letter-spacing: -0.01em;
        }

        .theme-toggle {
            display: flex;
            align-items: center;
            padding: 4px 8px;
            font-family: inherit;
            font-size: 0.82rem;
            color: var(--muted);
            background: none;
            border: 1px solid var(--border);
            border-radius: var(--radius-small);
            cursor: pointer;
            transition: background-color 0.12s ease, border-color 0.12s ease, color 0.12s ease;
        }

        .page {
            max-width: 880px;
            margin: 0 auto;
            padding: 40px 20px 80px;
        }

        .page:focus {
            outline: none;
        }

        .hero {
            display: flex;
            align-items: center;
            gap: 20px;
            margin-bottom: 40px;
        }

        .hero-avatar {
            flex-shrink: 0;
            width: 78px;
            height: 78px;
            background: var(--border);
            border: 2px solid var(--border);
            border-radius: 50%;
        }

        .hero-name {
            margin-bottom: 4px;
            font-size: 1.45rem;
            font-weight: 700;
            letter-spacing: -0.02em;
        }

        .hero-role {
            margin-bottom: 8px;
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--accent);
        }

        .hero-bio {
            max-width: 540px;
            font-size: 0.88rem;
            line-height: 1.65;
            color: var(--muted);
        }

        .filters {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 16px;
        }

        .search {
            width: 100%;
            padding: 10px 16px;
            font-family: inherit;
            font-size: 0.88rem;
            color: var(--text);
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            transition: border-color 0.12s ease;
        }

        .search::placeholder {
            color: var(--muted);
        }

        .search:focus-visible {
            border-color: var(--accent);
            outline: none;
        }

        /* iOS zooms into focused fields smaller than 16px. */
        @supports (-webkit-touch-callout: none) {
            .search {
                font-size: 1rem;
            }
        }

        .tag-row {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
        }

        .tag {
            padding: 4px 10px;
            font-family: inherit;
            font-size: 0.76rem;
            font-weight: 500;
            color: var(--accent);
            background: var(--accent-soft);
            border: none;
            border-radius: 99px;
            cursor: pointer;
            user-select: none;
            transition: background-color 0.12s ease, color 0.12s ease;
        }

        .tag[aria-pressed="true"] {
            color: var(--accent-text);
            background: var(--accent);
        }

        .result-count {
            margin-bottom: 12px;
            font-size: 0.78rem;
            color: var(--muted);
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(265px, 1fr));
            gap: 14px;
        }

        .card {
            display: flex;
            flex-direction: column;
            gap: 6px;
            padding: 18px 20px;
            text-decoration: none;
            color: inherit;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            box-shadow: 0 1px 4px var(--shadow);
            transition: border-color 0.15s ease, box-shadow 0.15s ease;
        }

        .card-title {
            font-size: 0.92rem;
            font-weight: 600;
            overflow-wrap: anywhere;
            color: var(--accent);
        }

        .card-description {
            flex: 1;
            font-size: 0.83rem;
            line-height: 1.55;
            color: var(--muted);
        }

        .card-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 4px;
            margin-top: 4px;
        }

        .card-tag {
            padding: 2px 8px;
            font-size: 0.71rem;
            color: var(--accent);
            background: var(--accent-soft);
            border-radius: 99px;
        }

        .empty-state {
            grid-column: 1 / -1;
            padding: 40px 0;
            font-size: 0.88rem;
            text-align: center;
            color: var(--muted);
        }

        /* Touch screens keep :hover after a tap, so only apply it where hover exists. */
        @media (hover: hover) {
            .theme-toggle:hover {
                color: var(--text);
                background: var(--surface-raised);
                border-color: var(--border-strong);
            }

            .tag:hover {
                color: var(--accent-text);
                background: var(--accent);
            }

            .card:hover {
                border-color: var(--accent);
                box-shadow: 0 4px 12px var(--shadow-strong);
            }
        }

        @media (max-width: 560px) {
            .hero {
                flex-direction: column;
                align-items: flex-start;
                gap: 16px;
            }
        }
    </style>

    <script type="module">
        // @ts-check

        /**
         * @typedef {'light' | 'dark'} Theme
         * @typedef {{ name: string, html_url: string, description: string, lists: string[] }} Repo
         * @typedef {{ repos: Repo[] }} Payload
         * @typedef {{ query: string, activeTag: string | null }} FilterCriteria
         * @typedef {(repo: Repo, criteria: FilterCriteria) => boolean} RepoFilter
         */

        const THEMES = Object.freeze({
            light: 'light',
            dark: 'dark',
        });

        /** @type {Readonly<Record<Theme, { icon: string, label: string }>>} */
        const THEME_TOGGLE_CONTENT = Object.freeze({
            [THEMES.light]: { icon: '🌙', label: 'Dark' },
            [THEMES.dark]: { icon: '☀️', label: 'Light' },
        });

        const STORAGE_KEYS = Object.freeze({
            theme: 'theme',
        });

        /** @type {Payload} */
        const EMPTY_PAYLOAD = Object.freeze({
            repos: [],
        });

        /** @type {Readonly<Record<string, string>>} */
        const HTML_ESCAPES = Object.freeze({
            '&': '&amp;',
            '<': '&lt;',
            '>': '&gt;',
            '"': '&quot;',
            "'": '&#39;',
        });

        /** @type {ReadonlyArray<'name' | 'description'>} */
        const SEARCH_FIELDS = Object.freeze([
            'name',
            'description',
        ]);

        /** @type {ReadonlyArray<RepoFilter>} */
        const REPO_FILTERS = Object.freeze([
            matchesQuery,
            matchesTag,
        ]);

        const elements = Object.freeze({
            themeToggle: getElement('[data-theme-toggle]'),
            themeIcon: getElement('[data-theme-icon]'),
            search: /** @type {HTMLInputElement} */ (getElement('[data-search]')),
            tagRow: getElement('[data-tag-row]'),
            resultCount: getElement('[data-result-count]'),
            grid: getElement('[data-grid]'),
            payload: getElement('[data-payload]'),
        });

        /**
         * @param {string} selector
         * @returns {HTMLElement}
         */
        function getElement(selector) {
            const element = document.querySelector(selector);
            if (!(element instanceof HTMLElement)) {
                throw new Error(`Missing element: ${selector}`);
            }

            return element;
        }

        /**
         * @param {string} key
         * @param {string} value
         */
        function writeStorage(key, value) {
            try {
                localStorage.setItem(key, value);
            } catch {
                // Storage can be blocked (private mode, sandboxed previews); the theme just won't persist.
            }
        }

        /**
         * @param {unknown} value
         * @returns {value is Theme}
         */
        function isTheme(value) {
            return Object.values(THEMES).some(theme => theme === value);
        }

        /** @returns {Theme} */
        function readInitialTheme() {
            const appliedTheme = document.documentElement.dataset.theme;

            return isTheme(appliedTheme) ? appliedTheme : THEMES.light;
        }

        /** @param {Theme} theme */
        function applyTheme(theme) {
            const toggleContent = THEME_TOGGLE_CONTENT[theme];

            state.theme = theme;
            document.documentElement.dataset.theme = theme;
            elements.themeIcon.textContent = toggleContent.icon;
            elements.themeToggle.setAttribute('aria-label', `Switch to ${toggleContent.label.toLowerCase()} theme`);
            writeStorage(STORAGE_KEYS.theme, theme);
        }

        function toggleTheme() {
            const nextTheme = state.theme === THEMES.dark ? THEMES.light : THEMES.dark;

            applyTheme(nextTheme);
        }

        /** @returns {Payload} */
        function readPayload() {
            try {
                return JSON.parse(elements.payload.textContent ?? '');
            } catch {
                return EMPTY_PAYLOAD;
            }
        }

        /**
         * @param {Repo[]} repos
         * @returns {Repo[]}
         */
        function sortByName(repos) {
            return [...repos].sort((left, right) => left.name.localeCompare(right.name));
        }

        /**
         * @param {Repo} repo
         * @param {FilterCriteria} criteria
         * @returns {boolean}
         */
        function matchesQuery(repo, criteria) {
            if (!criteria.query) {
                return true;
            }

            return SEARCH_FIELDS.some(field => repo[field].toLowerCase().includes(criteria.query));
        }

        /**
         * @param {Repo} repo
         * @param {FilterCriteria} criteria
         * @returns {boolean}
         */
        function matchesTag(repo, criteria) {
            if (criteria.activeTag == null) {
                return true;
            }

            return repo.lists.includes(criteria.activeTag);
        }

        /**
         * @param {unknown} value
         * @returns {string}
         */
        const escapeHtml = value => String(value).replace(/[&<>"']/g, character => HTML_ESCAPES[character]);

        /**
         * @param {number} count
         * @returns {string}
         */
        const formatRepoCount = count => `${count} repo${count === 1 ? '' : 's'}`;

        /**
         * @param {string} tag
         * @returns {HTMLButtonElement}
         */
        function createTagButton(tag) {
            const button = document.createElement('button');

            button.type = 'button';
            button.className = 'tag';
            button.dataset.tag = tag;
            button.textContent = tag;
            button.setAttribute('aria-pressed', 'false');

            return button;
        }

        function renderTags() {
            const tags = [...new Set(state.repos.flatMap(repo => repo.lists))].sort();
            const buttons = tags.map(tag => createTagButton(tag));

            elements.tagRow.replaceChildren(...buttons);
        }

        function syncTagButtons() {
            for (const button of elements.tagRow.querySelectorAll('[data-tag]')) {
                const isActive = button.getAttribute('data-tag') === state.activeTag;

                button.setAttribute('aria-pressed', String(isActive));
            }
        }

        /** @param {MouseEvent} event */
        function onTagRowClick(event) {
            const button = event.target instanceof Element
                ? event.target.closest('[data-tag]')
                : null;
            if (!button) {
                return;
            }

            const tag = button.getAttribute('data-tag');

            state.activeTag = state.activeTag === tag ? null : tag;
            syncTagButtons();
            renderRepos();
        }

        /**
         * @param {Repo} repo
         * @returns {string}
         */
        function renderCard(repo) {
            const tags = repo.lists
                .map(list => `<span class="card-tag">${escapeHtml(list)}</span>`)
                .join('');

            return `
                <a class="card" href="${escapeHtml(repo.html_url)}" target="_blank" rel="noopener noreferrer">
                    <span class="card-title">${escapeHtml(repo.name)}</span>
                    <span class="card-description">${escapeHtml(repo.description)}</span>
                    <span class="card-tags">${tags}</span>
                </a>
            `;
        }

        function renderRepos() {
            /** @type {FilterCriteria} */
            const criteria = {
                query: elements.search.value.trim().toLowerCase(),
                activeTag: state.activeTag,
            };
            const visibleRepos = state.repos.filter(repo => REPO_FILTERS.every(filter => filter(repo, criteria)));

            elements.resultCount.textContent = formatRepoCount(visibleRepos.length);

            if (visibleRepos.length === 0) {
                elements.grid.innerHTML = '<p class="empty-state">No repos match your search.</p>';

                return;
            }

            elements.grid.innerHTML = visibleRepos
                .map(repo => renderCard(repo))
                .join('');
        }

        /** @type {{ theme: Theme, activeTag: string | null, repos: Repo[] }} */
        const state = {
            theme: readInitialTheme(),
            activeTag: null,
            repos: sortByName(readPayload().repos),
        };

        applyTheme(state.theme);
        renderTags();
        renderRepos();

        elements.themeToggle.addEventListener('click', toggleTheme);
        elements.search.addEventListener('input', renderRepos);
        elements.tagRow.addEventListener('click', onTagRowClick);
    </script>
</body>
