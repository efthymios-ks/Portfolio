name: Refresh portfolio data

on:
  schedule:
    - cron: '0 6 * * 1'  # every Monday at 06:00 UTC
  workflow_dispatch:       # manual trigger

jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Generate data.js from GitHub starred lists
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 << 'EOF'
          import subprocess, json

          OWNER        = "efthymios-ks"
          TARGET_LISTS = {"net": ".NET", "powershell": "PowerShell"}

          query = """
          {
            user(login: "%s") {
              lists(first: 20) {
                nodes {
                  name
                  slug
                  items(first: 100) {
                    nodes {
                      ... on Repository {
                        name
                        isPrivate
                        owner { login }
                      }
                    }
                  }
                }
              }
            }
          }
          """ % OWNER

          result = subprocess.run(
              ["gh", "api", "graphql", "-f", f"query={query}"],
              capture_output=True, text=True, check=True
          )
          data = json.loads(result.stdout)

          repo_lists = {}
          for lst in data["data"]["user"]["lists"]["nodes"]:
              if lst["slug"] not in TARGET_LISTS:
                  continue
              list_name = TARGET_LISTS[lst["slug"]]
              for item in lst["items"]["nodes"]:
                  if item.get("isPrivate") or item.get("owner", {}).get("login") != OWNER:
                      continue
                  repo_lists.setdefault(item["name"], []).append(list_name)

          repo_lists = dict(sorted(repo_lists.items()))

          lines = [
              "// Auto-generated by pipeline — do not edit manually",
              "const REPO_LISTS = {",
          ]
          for name, lists in repo_lists.items():
              lists_str = ", ".join(f'"{l}"' for l in lists)
              lines.append(f'  "{name}": [{lists_str}],')
          lines.append("};")

          with open("data.js", "w") as f:
              f.write("\n".join(lines) + "\n")

          print(f"Generated data.js with {len(repo_lists)} repos")
          EOF

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data.js
          git diff --staged --quiet || (git commit -m "chore: refresh portfolio data" && git push)
